project:
  type: book
  output-dir: _book
  # Turns the EPUB into a native ebook: part pages, contents, copyright page.
  post-render:
    - scripts/polish_epub.py

# Code cells are executed once locally and the results are committed in
# _freeze/. CI reuses those results, so GPU chapters never need a GPU in CI.
execute:
  freeze: auto

book:
  title: "Machine Learning in Mobile AdTech"
  subtitle: "From Foundations to the Frontier of Demand Side Platforms"
  author: "Ben G Weber"
  date: last-modified
  output-file: "ml-in-mobile-adtech"
  site-url: https://bgweber.github.io/AdtechBook/
  repo-url: https://github.com/bgweber/AdtechBook
  search: true
  chapters:
    - index.qmd
    - preface.qmd
    - part: parts/part-1-ecosystem.qmd
      chapters:
        - chapters/01-introduction.qmd
        - chapters/02-the-rtb-ecosystem.qmd
        - chapters/02b-measurement-and-mmps.qmd
        - chapters/03-inside-a-demand-side-platform.qmd
    - part: parts/part-2-first-dsp.qmd
      chapters:
        - chapters/05-starting-from-scratch.qmd
        - chapters/06-parsing-bid-requests-and-eligibility.qmd
        - chapters/07-listening-before-bidding.qmd
        - chapters/08-logging-at-bid-time.qmd
        - chapters/09-a-click-model.qmd
        - chapters/10-pricing-a-click.qmd
        - chapters/11-shipping-the-first-model.qmd
        - chapters/12-operating-the-first-dsp.qmd
    - part: parts/part-3-competitive-dsp.qmd
      chapters:
        - chapters/13-from-clicks-to-installs-and-purchases.qmd
        - chapters/14-building-training-datasets.qmd
        - chapters/15-gradient-boosted-conversion-models.qmd
        - chapters/16-offline-evaluation-and-model-iteration.qmd
        - chapters/17-serving-models-in-the-bid-path.qmd
        - chapters/18-pipelines-validation-and-publishing.qmd
        - chapters/19-shadow-mode-canaries-and-ab-tests.qmd
        - chapters/20-win-rate-models-and-bid-shading.qmd
        - chapters/21-pricing-for-goals.qmd
        - chapters/22-basic-pacing.qmd
        - chapters/23-measuring-incrementality.qmd
        - chapters/24-operating-a-competitive-dsp.qmd
    - part: parts/part-4-state-of-the-art-dsp.qmd
      chapters:
        - chapters/25-where-trees-stop.qmd
        - chapters/26-deep-models-with-embeddings.qmd
        - chapters/27-sequences-and-transformers.qmd
        - chapters/28-serving-deep-models.qmd
        - chapters/29-retraining-and-real-time-learning.qmd
        - chapters/30-value-prediction.qmd
        - chapters/31-win-rate-curves-and-the-winners-curse.qmd
        - chapters/32-uplift-modeling.qmd
        - chapters/33-the-unified-pricing-equation.qmd
        - chapters/34-pacing-with-reinforcement-learning.qmd
        - chapters/35-learned-campaign-selection.qmd
        - chapters/36-personalized-creative-selection.qmd
        - chapters/37-operating-at-scale.qmd
    - part: parts/part-5-looking-ahead.qmd
      chapters:
        - chapters/38-ios-and-contextual-signals.qmd
        - chapters/39-building-the-ml-team.qmd
        - chapters/40-building-a-healthy-ml-culture.qmd
        - chapters/41-conclusion.qmd
  appendices:
    - appendices/a-glossary.qmd
    - appendices/b-openrtb-fields.qmd
    - appendices/c-templates.qmd
    - appendices/d-further-reading.qmd
    - appendices/e-simulated-world.qmd
  sidebar:
    style: docked
    tools:
      - icon: cart
        href: https://www.amazon.com/s?k=9798144378116   # ISBN search; swap for the product page URL once it is live
        text: "Buy the paperback on Amazon"
      - icon: download
        href: https://github.com/bgweber/AdtechBook/releases/latest
        text: "Download the free EPUB"
  page-footer:
    center: |
      Free online edition. [Paperback on Amazon](https://www.amazon.com/s?k=9798144378116) · [Free EPUB](https://github.com/bgweber/AdtechBook/releases/latest)<br>
      Text and figures [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) · Code [MIT](https://github.com/bgweber/AdtechBook/blob/main/LICENSE-CODE) · [Contribute](https://github.com/bgweber/AdtechBook/blob/main/CONTRIBUTING.md)

lang: en

# Wraps standalone display equations in a shaded box (gray in print,
# tinted in the web edition).
filters:
  - filters/formula-box.lua

format:
  # --- Free web edition (GitHub Pages) ---------------------------------
  html:
    theme: cosmo
    highlight-style: github
    css: styles/web.css
    code-copy: true
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 1

  # --- Amazon KDP 7" x 10" black-and-white paperback interior ----------
  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - open=right
      - cleardoublepage=empty
      - chapterprefix=true
      - headings=normal
    pdf-engine: xelatex
    geometry:
      - paperwidth=7in
      - paperheight=10in
      - inner=0.875in
      - outer=0.625in
      - top=0.85in
      - bottom=0.75in
      - bindingoffset=0in
      - headheight=14pt
      - headsep=0.25in
      - footskip=0.4in
    mainfont: "TeX Gyre Pagella"
    sansfont: "TeX Gyre Heros"
    monofont: "DejaVu Sans Mono"
    monofontoptions: [Scale=0.8]
    fontsize: 10.5pt
    linestretch: 1.05
    highlight-style: monochrome
    code-block-bg: "#E0E0E0"    # 12% gray, matching the formula boxes
    code-block-border-left: "#808080"
    callout-icon: false
    colorlinks: false
    links-as-notes: true        # print readers see URLs as footnotes
    toc: true
    toc-depth: 2
    toc-title: "Table of Contents"
    number-sections: true
    number-depth: 1
    fig-pos: "htb"
    fig-dpi: 300
    fig-width: 5.5              # text block width: 7in - 0.875in - 0.625in
    keep-tex: true
    include-in-header: styles/preamble.tex

  # --- Free ebook (reflowable EPUB 3) -----------------------------------
  # Not sold on KDP: a free download from each GitHub release that readers
  # can send to Kindle, Kobo, or Apple Books. Build it only once the print
  # PDF is locked by a proof copy.
  epub:
    toc: true
    # No epub-cover-image: an embedded cover made Kindle Previewer fail
    # ("Book conversion failed"). Retest when the EPUB is next built.
    css: styles/epub.css
    description: >-
      Build a mobile demand-side platform, from its first bid to the state of
      the art: click, install, and purchase models, win-rate models and bid
      shading, pacing, incrementality, deep learning and transformers, and the
      systems that train, serve, and operate them. Companion code and a bid
      simulator are at github.com/bgweber/AdtechBook.
    subject: "Machine learning; Advertising technology; Real-time bidding"
    publisher: Independently published
    highlight-style: monochrome
    # MathML keeps equations as text. If a Kindle device renders them
    # badly, switch to images with: html-math-method: webtex
    html-math-method: mathml
