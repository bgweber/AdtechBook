<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 10; }
      .sim { fill: #eff6ff; stroke: #3b82f6; }
      .dsp { fill: #fff7ed; stroke: #f97316; }
      .trn { fill: #f0fdf4; stroke: #22c55e; }
      .store { fill: #f8fafc; stroke: #64748b; stroke-dasharray: 4 3; }
      .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #475569; }
      .lab { font-size: 12px; fill: #1e293b; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .dash { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="590" fill="#ffffff"/>

  <rect class="box sim" x="20" y="30" width="270" height="310"/>
  <text class="title" x="40" y="60">adsim · the market</text>
  <text class="sub" x="40" y="86">devices and publisher apps</text>
  <text class="sub" x="40" y="106">three exchanges, first-price auctions</text>
  <text class="sub" x="40" y="126">competing bidders</text>
  <text class="sub" x="40" y="146">users who click, install, pay, play</text>
  <text class="sub" x="40" y="166">an MMP that attributes installs</text>
  <text class="sub" x="40" y="186">advertisers and their campaigns</text>
  <text class="sub" x="40" y="216">scenarios: failures, ad revenue,</text>
  <text class="sub" x="40" y="234">sure things, traffic surges</text>
  <text class="sub" x="40" y="264">knows the truth: every win rate,</text>
  <text class="sub" x="40" y="282">install rate, and the lift of</text>
  <text class="sub" x="40" y="300">every impression</text>

  <rect class="box dsp" x="430" y="30" width="250" height="310"/>
  <text class="title" x="450" y="60">bidder · the DSP (Go)</text>
  <text class="sub" x="450" y="86">bid path: eligibility, models,</text>
  <text class="sub" x="450" y="104">pricing, shading, pacing</text>
  <text class="sub" x="450" y="130">serves LightGBM trees natively</text>
  <text class="sub" x="450" y="156">experiments: shadow, canary,</text>
  <text class="sub" x="450" y="174">A/B tests, lift studies</text>
  <text class="sub" x="450" y="200">operations: kill switches,</text>
  <text class="sub" x="450" y="218">alerts, parity, reconciliation</text>
  <text class="sub" x="450" y="252">bids on :8080</text>
  <text class="sub" x="450" y="270">console on :8081</text>

  <rect class="box trn" x="790" y="30" width="190" height="310"/>
  <text class="title" x="808" y="60">adtrain (Python)</text>
  <text class="sub" x="808" y="86">the training service</text>
  <text class="sub" x="808" y="116">datasets from the ledger</text>
  <text class="sub" x="808" y="136">click, install, value,</text>
  <text class="sub" x="808" y="154">win, and uplift models</text>
  <text class="sub" x="808" y="180">pipeline and checks</text>
  <text class="sub" x="808" y="206">offline evaluation, A/B</text>
  <text class="sub" x="808" y="224">readouts, incrementality</text>
  <text class="sub" x="808" y="250">pacing forecasts and</text>
  <text class="sub" x="808" y="268">pricing tools</text>

  <!-- the market and the bidder -->
  <line class="line" x1="290" y1="75" x2="428" y2="75"/>
  <text class="lab" x="300" y="68">bid requests</text>
  <line class="line" x1="428" y1="105" x2="292" y2="105"/>
  <text class="lab" x="300" y="98">bids</text>
  <line class="line" x1="290" y1="145" x2="428" y2="145"/>
  <text class="lab" x="300" y="138">win, loss, billing</text>
  <line class="line" x1="290" y1="185" x2="428" y2="185"/>
  <text class="lab" x="300" y="178">clicks</text>
  <line class="line" x1="290" y1="225" x2="428" y2="225"/>
  <text class="lab" x="300" y="218">MMP postbacks</text>
  <line class="line" x1="290" y1="265" x2="428" y2="265"/>
  <text class="lab" x="300" y="258">campaigns, invoices</text>

  <!-- the console and the trainer -->
  <line class="line" x1="680" y1="110" x2="788" y2="110"/>
  <text class="lab" x="690" y="103">train, evaluate</text>
  <line class="line" x1="788" y1="140" x2="682" y2="140"/>
  <text class="lab" x="700" y="134">reports</text>

  <!-- stores -->
  <rect class="box store" x="20" y="420" width="270" height="105"/>
  <text class="title" x="40" y="450">out/sim</text>
  <text class="sub" x="40" y="474">the market's logs, and the truth</text>
  <text class="sub" x="40" y="492">to check every model against</text>

  <rect class="box store" x="330" y="420" width="270" height="105"/>
  <text class="title" x="350" y="450">out/ledger</text>
  <text class="sub" x="350" y="474">every bid with its features and</text>
  <text class="sub" x="350" y="492">pricing terms, notices, clicks,</text>
  <text class="sub" x="350" y="510">postbacks, by simulated day</text>

  <rect class="box store" x="640" y="420" width="220" height="105"/>
  <text class="title" x="660" y="450">out/models</text>
  <text class="sub" x="660" y="474">published bundles,</text>
  <text class="sub" x="660" y="492">experiments, levers</text>

  <line class="line" x1="155" y1="340" x2="155" y2="418"/>
  <text class="lab" x="165" y="384">writes</text>
  <line class="line" x1="480" y1="340" x2="480" y2="418"/>
  <text class="lab" x="490" y="384">logs</text>
  <line class="dash" x1="660" y1="418" x2="660" y2="342"/>
  <text class="lab" x="568" y="400">loads, deploys</text>
  <line class="line" x1="840" y1="340" x2="840" y2="418"/>
  <text class="lab" x="772" y="384">publishes</text>
  <path class="line" d="M 465 525 L 465 552 L 950 552 L 950 342"/>
  <text class="lab" x="700" y="546">reads the ledger</text>
  <path class="dash" d="M 155 525 L 155 572 L 965 572 L 965 342"/>
  <text class="lab" x="300" y="566">reads the truth, to check (never the bidder)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
