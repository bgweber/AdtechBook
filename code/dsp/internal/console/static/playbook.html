<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook · DSP console</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --ink: #1d232b; --muted: #6b7280; --line: #e3e3df;
          --accent: #e8932d; --navy: #15202e; }
  body { margin: 0; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; gap: 18px; align-items: baseline; }
  header a { color: #c9d1db; text-decoration: none; font-size: 13px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  main { max-width: 760px; margin: 20px 24px; background: var(--panel); border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 28px 20px; }
  h1.t { font-size: 22px; margin: 18px 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f1f1ee; padding: 1px 4px; border-radius: 3px; }
  pre { background: #15202e; color: #e8ecf1; padding: 10px 14px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; color: inherit; padding: 0; }
  li { margin: 3px 0; }
  nav.all { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  nav.all a { color: #1c5cab; margin-right: 10px; }
</style>
</head>
<body>
<header><h1>Playbook</h1><a href="./#controls">← back to the console's alerts</a></header>
<main id="doc">Loading…</main>
<script>
// Playbooks are short markdown files, one per alert (Chapter 24). This
// renders the small part of markdown they use: headings, paragraphs,
// lists, code blocks, inline code, bold, and links.
const names = ["prediction_shift", "prediction_collapse", "fallback_spike", "parity", "bad_labels",
  "spend_rate", "no_bids", "latency", "reconciliation_gap"];
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
function render(md) {
  const out = [], lines = md.split("\n");
  let list = null, para = [];
  const flush = () => {
    if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
    if (list) { out.push(`<${list.tag}>` + list.items.map(i => "<li>" + i + "</li>").join("") + `</${list.tag}>`); list = null; }
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i], t = l.trim();
    if (t.startsWith("```")) {
      const code = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith("```"); i++) code.push(lines[i].replace(/^ {0,3}/, ""));
      const html = "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
      if (list && /^\s/.test(l)) list.items[list.items.length - 1] += html; else { flush(); out.push(html); }
      continue;
    }
    if (!t) { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } continue; }
    let m;
    if ((m = t.match(/^(#{1,3}) (.*)/))) { flush(); out.push(m[1].length === 1 ? `<h1 class="t">${inline(m[2])}</h1>` : `<h2>${inline(m[2])}</h2>`); continue; }
    if ((m = l.match(/^(\d+)\. (.*)/)) || (m = l.match(/^- (.*)/))) {
      if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
      const tag = /^\d/.test(l) ? "ol" : "ul", text = m[2] ?? m[1];
      if (!list || list.tag !== tag) { flush(); list = {tag, items: []}; }
      list.items.push(inline(text));
      continue;
    }
    if (list && /^\s+\S/.test(l)) { list.items[list.items.length - 1] += " " + inline(t); continue; }
    if (list) flush();
    para.push(t);
  }
  flush();
  return out.join("\n");
}
const name = new URLSearchParams(location.search).get("alert") || "prediction_shift";
const doc = document.getElementById("doc");
fetch("playbooks/" + (names.includes(name) ? name : "prediction_shift") + ".md", {cache: "no-store"})
  .then(r => r.ok ? r.text() : Promise.reject(r.status))
  .then(md => {
    doc.innerHTML = render(md) + '<nav class="all">All playbooks: ' +
      names.map(n => `<a href="?alert=${n}">${n.replace(/_/g, " ")}</a>`).join("") + "</nav>";
    document.title = doc.querySelector("h1").textContent + " · Playbook";
  })
  .catch(e => { doc.textContent = "No playbook for " + name + " (" + e + ")."; });
</script>
</body>
</html>
