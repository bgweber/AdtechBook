[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adtrain"
version = "0.18.0"
description = "Training, validation, and publishing for the reference DSP's click model (Machine Learning in Mobile AdTech, Part II)"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "mmh3>=4.0", "pandas>=2.0", "pyarrow>=12", "lightgbm>=4.0"]

[project.optional-dependencies]
# kept for older install commands; pandas and pyarrow are now required
truth = []
test = ["pytest>=7"]
# the deep models of Part IV (Chapters 25-29)
deep = ["torch>=2.2", "onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
include = ["adtrain*"]
