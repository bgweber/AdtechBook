name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Go code
        id: check
        run: |
          if [ -f code/dsp/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code/dsp/go.mod yet; skipping Go tests."
          fi

      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: code/dsp/go.mod
          cache: false

      - name: go vet and go test
        if: steps.check.outputs.present == 'true'
        working-directory: code/dsp
        run: |
          go vet ./...
          go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Python tests
        id: check
        run: |
          if find code -name 'test_*.py' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test_*.py files under code/ yet; skipping pytest."
          fi

      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/*/pyproject.toml

      - name: Install the Python packages under code/
        if: steps.check.outputs.present == 'true'
        run: |
          pip install pytest
          for p in code/*/pyproject.toml; do
            pip install -e "$(dirname "$p")[test]"
          done

      - name: pytest
        if: steps.check.outputs.present == 'true'
        run: pytest code
